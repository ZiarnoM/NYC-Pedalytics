version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"   # Web UI
      - "9000:9000"   # HDFS RPC
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - hadoop-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    depends_on:
      - namenode
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - hadoop-net

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.2
    container_name: spark-master
    restart: always
    ports:
      - "8080:8080"   # Web UI
      - "7077:7077"   # Spark RPC
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ../analysis:/app/analysis
      - ../output:/app/output
    networks:
      - hadoop-net

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.2
    container_name: spark-worker
    restart: always
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ../analysis:/app/analysis
      - ../output:/app/output
    networks:
      - hadoop-net

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  hadoop-net:
    driver: bridge
